<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora - Mi Portafolio</title>

<!-- Conexión con tu nuevo archivo CSS -->
<link rel="stylesheet" href="calculadora.css">
<!--css header -->
<link rel="stylesheet" href="../componentes/header.css">

<link rel="stylesheet" href="../componentes/footer/footer.css">

</head>
<body>

<!-- HEADER INTEGRADO -->

<div id="header-container"></div>


<!-- CONTENEDOR DE LA CALCULADORA -->
<div class="calculator-container">
  <div class="calculator">
    <div class="display" id="display">0</div>
    <div class="buttons">
      <button class="btn-danger span-2" onclick="clearDisplay()">C</button>
      <button onclick="deleteLast()">⌫</button>
      <button onclick="appendOperator('/')">÷</button>

      <button onclick="appendNumber('7')">7</button>
      <button onclick="appendNumber('8')">8</button>
      <button onclick="appendNumber('9')">9</button>
      <button onclick="appendOperator('*')">×</button>

      <button onclick="appendNumber('4')">4</button>
      <button onclick="appendNumber('5')">5</button>
      <button onclick="appendNumber('6')">6</button>
      <button onclick="appendOperator('-')">-</button>

      <button onclick="appendNumber('1')">1</button>
      <button onclick="appendNumber('2')">2</button>
      <button onclick="appendNumber('3')">3</button>
      <button onclick="appendOperator('+')">+</button>

      <button onclick="appendNumber('0')" class="span-2">0</button>
      <button onclick="appendNumber('.')">.</button>
      <button class="calc-btn-primary" onclick="calculate()">=</button>
    </div>
  </div>
</div>

<div id="footer-container"></div>

<!-- Conexión con tu nuevo archivo JavaScript (siempre al final del body) -->
<script src="calculadora.js"></script>

<script src="../componentes/header.js"></script>

<script src="../componentes/footer/footer.js"></script>

</body>
</html>
